name: Publish

on:
  push:
    branches:
      - main
    # JSR skips versions that are already published, so this only needs to run when
    # the version (package.json — bumped by the Release workflow) or the JSR
    # manifest itself changed. Keeps doc/CI pushes off the JSR runner. The Release
    # workflow's own commit is pushed with GITHUB_TOKEN, which GitHub does not
    # re-trigger workflows from — hence the manual trigger.
    paths:
      - package.json
      - jsr.json
      - .github/workflows/jsr.yml
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - uses: actions/checkout@v6

      # jsr publish runs Deno with --unstable-byonm, which resolves the npm
      # dependencies declared in package.json out of the local node_modules — without
      # this step it fails with "Could not find 'commander' in a node_modules folder".
      - name: Install dependencies
        run: npm ci

      # jsr.json must carry a version (JSR rejects a manifest without one), and
      # package.json is the single source of truth. Re-pin before publishing or JSR
      # would keep republishing whatever version jsr.json happened to hold.
      - name: Sync JSR version from package.json
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const jsr = JSON.parse(fs.readFileSync("jsr.json", "utf8"));
            jsr.version = pkg.version;
            fs.writeFileSync("jsr.json", JSON.stringify(jsr, null, 2) + "\n");
          '
          echo "Publishing @lechcher/gflow-cli@$(node -p 'require("./package.json").version')"

      # --allow-dirty: the sync step above intentionally rewrites jsr.json in the
      # workspace, and JSR refuses to publish a tree with uncommitted changes.
      - name: Publish package
        run: npx jsr publish --allow-dirty
